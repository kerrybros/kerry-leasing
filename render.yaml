# Render deployment configuration — Kerry Leasing
#
# IMPORTANT: these services are managed MANUALLY in the Render dashboard, not via
# Blueprint auto-sync. This file is documentation, kept in step with reality by
# hand — editing it does NOT change the running services. Reconciled against the
# live Render account on 2026-07-07.
#
# Conventions that vary by service (matching what's actually deployed):
#   - The web service uses rootDir: apps/api, so its commands have no `cd` prefix.
#   - The Motive/Samsara crons run from the repo root via root package.json
#     scripts (pnpm sync-motive / sync-samsara).
#   - The weekly-SMS and whiparound crons run from the repo root but `cd apps/api`
#     in their commands.
# Secrets and environment-specific values use `sync: false` (set in the dashboard).

services:
  # ---------------------------------------------------------------------------
  # API (Express) — serves the portal backend, cron HTTP endpoints, and the
  # Twilio webhooks. Frontend (Vercel) points NEXT_PUBLIC_API_URL here.
  # URL: https://kerry-leasing.onrender.com
  # ---------------------------------------------------------------------------
  - type: web
    name: kerry-leasing
    runtime: node
    region: virginia
    plan: standard
    branch: main
    rootDir: apps/api
    autoDeploy: true
    buildCommand: pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: pnpm start
    # Apply pending Prisma migrations after build, before the new version goes
    # live. Without this, a merged migration ships with code referencing columns
    # the DB doesn't have yet (this bit us on 2026-07-07).
    preDeployCommand: pnpm prisma:app:migrate:deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: APP_DATABASE_URL
        sync: false
      - key: REPAIR_DATABASE_URL
        sync: false
      - key: REPAIR_SHOP_ORG_ID
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Microsoft Graph app creds (daily-service workbook + weekly report email)
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_SITE_HOSTNAME
        sync: false
      - key: MICROSOFT_GRAPH_SITE_PATH
        sync: false
      - key: MICROSOFT_GRAPH_DAILY_SERVICE_ITEM_ID
        sync: false
      # Weekly driver report — email sender + master on-switch (powers "Send now")
      - key: REPORT_EMAIL_FROM
        sync: false
      - key: WEEKLY_DRIVER_SMS_ENABLED
        sync: false
      # Twilio (SMS) is NOT set here yet — inbound webhook signature verification
      # needs TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN once the A2P campaign is live.

  # ---------------------------------------------------------------------------
  # Motive daily telematics sync — repo root, root package.json script.
  # ---------------------------------------------------------------------------
  - type: cron
    name: kerry-leasing-motive
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "0 11 * * *"  # daily 11:00 UTC
    buildCommand: pnpm install --frozen-lockfile; pnpm run build
    startCommand: pnpm sync-motive
    envVars:
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Samsara daily telematics sync — repo root, root package.json script.
  # ---------------------------------------------------------------------------
  - type: cron
    name: kerry-leasing-samsara
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "0 11 * * *"  # daily 11:00 UTC
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm sync-samsara
    envVars:
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Whiparound inspection sync — EST business hours.
  # NOTE: the live service name is "whiparound-snyc" (typo preserved to match
  # Render; renaming in Render recreates the service).
  # ---------------------------------------------------------------------------
  - type: cron
    name: whiparound-snyc
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "0 12,14,17,20,23 * * *"  # ~7a/9a/12p/3p/6p ET
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-whiparound-daily.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Weekly driver scorecard — SMS + Email. Mondays. Requires the master switch
  # WEEKLY_DRIVER_SMS_ENABLED=true or it no-ops.
  # ---------------------------------------------------------------------------
  - type: cron
    name: kerry-weekly-driver-sms
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "0 10 * * 1"  # Mondays 10:00 UTC (~6a ET EDT / 5a EST)
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-weekly-driver-sms.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: WEEKLY_DRIVER_SMS_ENABLED  # must be "true" or the run skips all orgs
        sync: false
      - key: REPORT_EMAIL_FROM
        sync: false
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_SITE_HOSTNAME
        sync: false
      - key: MICROSOFT_GRAPH_SITE_PATH
        sync: false
      # REPORT_PUBLIC_BASE_URL falls back to https://www.kerryleasing.com in code.
      # Twilio SMS vars needed here too once A2P is live (TWILIO_ACCOUNT_SID,
      # TWILIO_AUTH_TOKEN, TWILIO_MESSAGING_SERVICE_SID, TWILIO_STATUS_CALLBACK_URL).

  # ---------------------------------------------------------------------------
  # EIA Midwest retail diesel price → system_config. Feeds idle fuel-cost in the
  # driver scorecards. Recreated 2026-07-07 (was missing; price had been frozen).
  # ---------------------------------------------------------------------------
  - type: cron
    name: kerry-eia-diesel-price
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "30 11 * * *"  # daily 11:30 UTC (EIA publishes weekly)
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-refresh-fuel-price.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: EIA_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Motive scheduled-report intake. Motive support (case 11057761) confirmed the
  # v2/driver_utilization API and the dashboard "Driver Fuel Performance" report
  # use different calculation models and the REPORT is the source of truth for
  # driving/idle time. The report is scheduled inside Motive (daily, 12:00 AM
  # ET, CSV) to a shared mailbox; this job pulls it via Graph Mail.Read (scoped
  # by an Exchange ApplicationAccessPolicy to the "KL API Mail Access" group)
  # and the scorecard prefers those rows. Added 2026-09-14.
  # ---------------------------------------------------------------------------
  - type: cron
    name: kerry-motive-report-ingest
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "30 5 * * *"  # daily 05:30 UTC = 01:30 ET, after Motive's 12:00 AM ET report email
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-motive-report-ingest.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: MOTIVE_REPORT_MAILBOX
        value: motive-reports@kerrybros.com
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_SITE_HOSTNAME
        sync: false
      - key: MICROSOFT_GRAPH_SITE_PATH
        sync: false

  # ---------------------------------------------------------------------------
  # Motive PORTAL PULL (primary intake once proven). Logs into the Fleet
  # Dashboard as each org's dedicated portal user (credentials live in the org's
  # encrypted credentials blob, set via set-motive-portal-login.ts) and re-pulls
  # Driver Fuel Performance for the last 14 days, last 2 weeks and current/prior
  # month, every night. Re-pulling captures Motive's late additions to a day.
  # The login is plain HTTP against the dashboard's own form, no browser, so
  # this runs fine on a starter instance. Added 2026-09-18.
  # ---------------------------------------------------------------------------
  - type: cron
    name: kerry-motive-portal-pull
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "0 13 * * *"  # daily 13:00 UTC = 09:00 ET. Motive's nightly batch publishes
                            # yesterday between 04:00 and 08:00 ET (measured over four nights).
    # --prod=false because NODE_ENV=production otherwise makes pnpm skip
    # devDependencies, and the build tools live there.
    buildCommand: pnpm install --frozen-lockfile --prod=false; pnpm run build
    startCommand: pnpm --filter @kerry-leasing/api pull-motive-portal
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Cron-health watchdog — emails an alert (via Graph) when any scheduled job
  # hasn't succeeded within its window. The safety net for silent cron death.
  # Added 2026-07-07. Set CRON_ALERT_EMAIL to a monitored inbox.
  # ---------------------------------------------------------------------------
  - type: cron
    name: kerry-cron-health
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: ""
    schedule: "0 13 * * *"  # daily 13:00 UTC — after the 11:00 telematics syncs
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-cron-health-check.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: REPORT_EMAIL_FROM
        sync: false
      - key: CRON_ALERT_EMAIL
        sync: false
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
