# Render deployment configuration
services:
  - type: web
    name: kerry-leasing-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && pnpm start
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REPAIR_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: kerry-whiparound-sync
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 12,14,17,20,23 * * *"  # EST business hours: 7am, 9am, 12pm, 3pm, 6pm (UTC-5; runs ~1h early during EDT)
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-whiparound-daily.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false

  - type: cron
    name: kerry-eia-diesel-price
    runtime: node
    region: oregon
    plan: starter
    schedule: "30 11 * * *"  # Daily ~11:30 UTC — EIA Midwest retail diesel → system_config (weekly data; daily job picks up new rows)
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-refresh-fuel-price.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: EIA_API_KEY
        sync: false
