# Render deployment configuration
services:
  - type: web
    name: kerry-leasing-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && pnpm start
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REPAIR_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CRON_SECRET
        sync: false
