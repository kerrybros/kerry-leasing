# Render deployment configuration
services:
  - type: web
    name: kerry-leasing-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && pnpm start
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REPAIR_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CRON_SECRET
        sync: false
      # Twilio: required by the webhook handlers (/webhooks/twilio/*) for
      # inbound-signature verification. Without these, validateInboundSignature
      # accepts unsigned/forged requests in prod. Values set in Render dashboard.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      # Weekly driver report email — sender mailbox. Sent via the MICROSOFT_GRAPH_*
      # app creds already configured on this service (daily-service workbook).
      - key: REPORT_EMAIL_FROM
        sync: false

  - type: cron
    name: kerry-whiparound-sync
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 12,14,17,20,23 * * *"  # EST business hours: 7am, 9am, 12pm, 3pm, 6pm (UTC-5; runs ~1h early during EDT)
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-whiparound-daily.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false

  - type: cron
    name: kerry-weekly-driver-sms
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 10 * * 1"  # Mondays 5am ET (EST) / 6am ET (EDT) — fixed UTC so DST drifts ±1h
    # Single weekly cron entry → no per-hour filtering. All enabled customers
    # fire when this runs. To support multiple send hours later, add additional
    # cron entries with --target-hour=N matching the desired sendHourEt.
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-weekly-driver-sms.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: REPORT_PUBLIC_BASE_URL
        sync: false
      - key: EIA_API_KEY
        sync: false
      # Email channel (weekly driver reports). This cron is a separate Render
      # service, so it needs its own copy of the Graph app creds + sender mailbox.
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_SITE_HOSTNAME
        sync: false
      - key: MICROSOFT_GRAPH_SITE_PATH
        sync: false
      - key: REPORT_EMAIL_FROM
        sync: false

  - type: cron
    name: kerry-eia-diesel-price
    runtime: node
    region: oregon
    plan: starter
    schedule: "30 11 * * *"  # Daily ~11:30 UTC — EIA Midwest retail diesel → system_config (weekly data; daily job picks up new rows)
    buildCommand: cd apps/api && pnpm install && pnpm prisma:app:generate && pnpm prisma:repair:generate && pnpm build
    startCommand: cd apps/api && node dist/scripts/run-refresh-fuel-price.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATABASE_URL
        sync: false
      - key: EIA_API_KEY
        sync: false
